{% extends 'base.html' %}
{% block content %}
You are visiting the homepage.

<!-- TODO: Display a list of users here, with each linking to their profile -->
<h2>Users</h2>
{% if users %}
<ul>
    {% for user in users %}
    <li>
        <a href="{{ url_for('main.profile', username=user.username) }}">{{ user.username }}</a>
    </li>
    {% endfor %}
</ul>
{% else %}
<p>No users found.</p>
{% endif %}
{% endblock %}
